name: SHUTTL checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-engineering-evidence
          path: |
            outputs/validation-2026-10-11/
            outputs/visual-design-2026-10-12/
            outputs/home-focus-2026-10-12/
            outputs/home-persona-review-2026-10-12/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-diagnostics
          path: test-results/
          retention-days: 7
